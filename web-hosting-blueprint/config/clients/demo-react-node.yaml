client:
  name: demo-react-node
  id: demo-react-node

application:
  name: tasks-app
  slug: tasks-app

environment:
  name: development
  type: development

hosting:
  profile: small

frontend:
  enabled: true
  framework: react
  source:
    path: frontend/examples/react
    build_context: frontend/examples/react
  port: 80

backend:
  enabled: true
  framework: node
  source:
    path: backend/examples/node
    build_context: backend/examples/node
  port: 8000
  health_endpoint: /health
  expose_publicly: false

database:
  enabled: true
  engine: postgresql
  version: "16"
  name: tasksdb
  user: tasksuser

redis:
  enabled: false

domains:
  frontend: tasks.local
  backend: api.tasks.local

ssl:
  enabled: false

deployment:
  strategy: rolling

resources:
  frontend:
    cpus: "0.5"
    memory: 256M
  backend:
    cpus: "0.5"
    memory: 512M
  postgres:
    cpus: "0.5"
    memory: 512M

secrets:
  postgres_password: WHBP_POSTGRES_PASSWORD

logging:
  driver: json-file
  max_size: 10m
  max_file: "3"

integration:
  business_continuity:
    export_inventory: true
    export_path: exports/inventory.json
