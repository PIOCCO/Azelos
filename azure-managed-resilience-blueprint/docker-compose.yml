services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amrf
      POSTGRES_PASSWORD: amrf
      POSTGRES_DB: amrf
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrf"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://amrf:amrf@postgres:5432/amrf
      DEMO_MODE: "true"
      ENVIRONMENT: development
      AUTH_MODE: jwt
      APP_ENV: dev
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - api
