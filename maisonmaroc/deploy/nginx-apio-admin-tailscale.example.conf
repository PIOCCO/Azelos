# APIO Super Admin — Tailscale-only (NOT on public dribex.ma/APIO).
#
# Dribex native admin (/admin on the main site) is configured outside this repo.
# Verify the live Dribex admin port on the host:  ss -lntp | grep -E '721[0-9]|admin'
#
# APIO Admin uses a separate port (default 7217). Do NOT reuse the Dribex admin port.
#
# Pattern (match your Dribex admin nginx model):
#   1) Listen on the server's Tailscale IP (or loopback + tailscale serve).
#   2) allow/deny by Tailscale CGNAT (100.64.0.0/10) or tighter /32 entries.
#   3) Proxy to 127.0.0.1:7217 where apio-admin listens.
#
# Replace TS_IP with this machine's Tailscale address (tailscale ip -4).

server {
    listen TS_IP:7217;
    listen [::1]:7217;

    # Tighten to your operators, e.g. 100.80.43.124/32
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    server_name _;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Host firewall (example — do NOT expose 7217 on the public interface):
#   ufw deny 7217
#   ufw allow in on tailscale0 to any port 7217 proto tcp
