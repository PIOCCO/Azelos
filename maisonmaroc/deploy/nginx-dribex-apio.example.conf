# APIO on https://dribex.ma/APIO — example Nginx snippets (adjust paths).
# Dribex root (/), /api, /admin, /metrics, /ready MUST remain unchanged.
#
# 1) Build frontend:  cd maisonmaroc && npm run build:apio
# 2) Deploy dist/ to e.g. /var/www/dribex/apio/
# 3) Run APIO Node on 127.0.0.1:3001 (systemd/PM2/Docker, not public)
# 4) Include these locations in the main dribex.ma server block.

# APIO backend — prefixed so Dribex /api is untouched
location /APIO/api/ {
  proxy_pass http://127.0.0.1:3001/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 12m;
  proxy_read_timeout 120s;
}

# APIO static SPA (assets + index.html fallback)
location /APIO/ {
  alias /var/www/dribex/apio/;
  try_files $uri $uri/ /APIO/index.html;
}

# Optional: deny direct access to SQLite / uploads if ever mis-placed under web root
location ~ ^/APIO/(.*\.(sqlite|env|log))$ {
  return 404;
}
