services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paic
      POSTGRES_PASSWORD: paic
      POSTGRES_DB: paic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paic -d paic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://paic:paic@postgres:5432/paic
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      LLM_MOCK: "true"
      APP_ENV: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: celery -A workers.celery_app.celery worker -Q ingestion -l info
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://paic:paic@postgres:5432/paic
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      LLM_MOCK: "true"
    depends_on:
      - api
      - redis

  ollama:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    ports:
      - "11434:11434"

  admin-frontend:
    build:
      context: admin-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  employee-web:
    build:
      context: employee-app/web
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - admin-frontend
      - employee-web

volumes:
  pgdata:
  miniodata:
