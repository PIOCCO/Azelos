name: App CI

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "Azelos_DORA_BP/backend/**"
      - "Azelos_DORA_BP/frontend/**"
      - "Azelos_DORA_BP/Dockerfile.app"
  pull_request:
    paths:
      - "Azelos_DORA_BP/**"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Azelos_DORA_BP/backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dora_test
      JWT_SECRET_KEY: test-secret-key-with-enough-length-for-dev-only-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azelos_DORA_BP/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm test -- --run

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Azelos_DORA_BP/Dockerfile.app -t dora-bp:ci Azelos_DORA_BP
