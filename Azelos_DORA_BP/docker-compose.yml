services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: dora
      POSTGRES_DB: dora_supplier_risk
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora -d dora_supplier_risk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dora_pg_data:/var/lib/postgresql/data

  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      DATABASE_URL: postgresql+psycopg://dora:dora@postgres:5432/dora_supplier_risk
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      SERVE_FRONTEND: "1"
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dora_pg_data:
