[project]
name = "azelos-dora-supplier-risk"
version = "0.1.0"
description = "DORA Supplier Risk Blueprint — PostgreSQL source of truth"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "fastapi>=0.115,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib>=1.7,<2",
    "email-validator>=2.0,<3",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    "strawberry-graphql[fastapi]>=0.258,<1",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.19,<2",
    "azure-mgmt-resource>=23.0,<24",
]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
