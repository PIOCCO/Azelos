[project]
name = "azelos-dora-supplier-risk"
version = "0.1.0"
description = "DORA Supplier Risk Blueprint — PostgreSQL source of truth"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
